<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><style>html,body{margin:0;padding:0;background:transparent}#dream-loader{font:14px/1.75 KaiTi,楷体,"Noto Serif SC",serif;color:#c59d5f;background:#18100d;border:1px solid rgba(197,157,95,.4);border-radius:8px;padding:14px 18px;margin:4px}#dream-loader-letter{white-space:pre-wrap;color:#eadbc0;margin-top:8px}#dream-loader button{margin-top:10px;background:#2d1f15;color:#e2c48f;border:1px solid #c59d5f;border-radius:5px;padding:6px 14px;font:inherit;cursor:pointer}</style></head><body><template id="dream-letter-src">$1</template><template id="dream-macro-user">{{user}}</template><template id="dream-macro-char">{{char}}</template><div id="dream-loader"><div id="dream-loader-status" role="status">固定版信笺正在展开……</div><div id="dream-loader-letter" hidden></div><button id="dream-loader-retry" type="button" hidden>再试一次</button></div><script>(()=>{
 'use strict';
 __FIXED_RELEASE_CLIENT__
 const VERSION=__FIXED_VERSION__;
 const EMBEDDED=__FIXED_CONFIG__;
 let PIN=EMBEDDED,BASES;
 const prefix=()=> 'https://reader-cache.invalid/fixed/'+PIN.repository+'/'+PIN.version+'/'+PIN.manifestSha256+'/';
 const PLACEHOLDER='<!--DREAM_LETTER-->';
 const $=id=>document.getElementById(id),status=$('dream-loader-status'),retry=$('dream-loader-retry'),plain=$('dream-loader-letter');let busy=false;
 const decode=b=>new TextDecoder('utf-8',{fatal:true}).decode(b);
 const openCache=async()=>{try{return window.caches?await caches.open('dream-reader-fixed-v1'):null;}catch(e){return null;}};
 const timed=async url=>{const c=typeof AbortController==='function'?new AbortController():null,t=c?setTimeout(()=>c.abort(),60000):0;try{const r=await fetch(url,{credentials:'omit',redirect:'error',signal:c?c.signal:undefined});if(!r.ok)throw Error('HTTP '+r.status);return await r.arrayBuffer();}finally{clearTimeout(t);}};
 const valid=m=>m&&m.schema===1&&m.name==='dream-reader-render-fixed'&&m.version===PIN.version&&m.resources&&typeof m.resources==='object'&&!Array.isArray(m.resources)&&m.files&&['reader.css','reader-body.html','reader.js'].every(k=>{const f=m.files[k];return f&&typeof f.path==='string'&&/^dist\/[\w.-]+$/.test(f.path)&&Number.isSafeInteger(f.bytes)&&f.bytes>0&&f.bytes<20000000&&/^[a-f0-9]{64}$/.test(f.sha256);});
 async function verifiedBytes(bytes,sha,size){if(size!==undefined&&bytes.byteLength!==size)return false;if(!window.DreamFixedReleaseClient||typeof window.DreamFixedReleaseClient.sha256!=='function')throw Error('固定版完整性校验不可用；未执行远程代码');return await window.DreamFixedReleaseClient.sha256(bytes)===sha;}
 async function fixedFile(path,sha,size,cache){
  const key=prefix()+sha+'/'+path;
  if(cache){try{const hit=await cache.match(key);if(hit){const bytes=await hit.arrayBuffer();if(await verifiedBytes(bytes,sha,size))return bytes;}}catch(e){}}
  for(const base of BASES){try{const bytes=await timed(base+path);if(bytes.byteLength>20000000||!(await verifiedBytes(bytes,sha,size)))throw Error('完整性校验失败');if(cache){try{await cache.put(key,new Response(bytes));}catch(e){}}return bytes;}catch(e){}}
  throw Error('固定版本资源不可用或校验失败：'+path+'（不会切换到最新版）');
 }
 async function start(){if(busy)return;busy=true;retry.hidden=true;status.textContent='固定版 v'+VERSION+' 信笺正在展开……';
  try{
   if(!window.DreamFixedReleaseClient||typeof window.DreamFixedReleaseClient.sha256!=='function')throw Error('固定版完整性校验不可用；未执行远程代码');
   if(!/^[0-9]+(?:\.[0-9]+){1,3}$/.test(VERSION))throw Error('固定版本号须为 2–4 段数字');
   if(VERSION!==EMBEDDED.version){const resolved=await window.DreamFixedReleaseClient.resolve(EMBEDDED.repository,VERSION);PIN=resolved.metadata;if(!PIN||PIN.schema!==1||PIN.repository!==EMBEDDED.repository||PIN.version!==VERSION||!/^[a-f0-9]{40}$/.test(PIN.sourceCommit)||!/^[a-f0-9]{64}$/.test(PIN.manifestSha256))throw Error('指定数字版本的固定发布信息无效');}
   BASES=Object.freeze(['https://raw.githubusercontent.com/'+PIN.repository+'/'+PIN.sourceCommit+'/', 'https://cdn.jsdelivr.net/gh/'+PIN.repository+'@'+PIN.sourceCommit+'/']);
   const cache=await openCache(),manifestBytes=await fixedFile('fixed-release-manifest.json',PIN.manifestSha256,undefined,cache),m=JSON.parse(decode(manifestBytes));
   if(!valid(m))throw Error('固定版本清单无效或版本号不符');
   const values=await Promise.all(['reader.css','reader-body.html','reader.js'].map(async k=>{const f=m.files[k];return decode(await fixedFile(f.path,f.sha256,f.bytes,cache));}));
   const [css,body,js]=values.map(macros),letter=$('dream-letter-src').innerHTML;
   window.DREAM_READER_FIXED=Object.freeze(Object.assign({},PIN,{bases:BASES,manifest:m}));
   window.DREAM_READER_RELEASE={version:PIN.version,base:BASES[0],fixed:true,sourceCommit:PIN.sourceCommit,manifestSha256:PIN.manifestSha256};
   const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);
   document.body.innerHTML=body.split(PLACEHOLDER).join(letter);
   const s=document.createElement('script');s.text=js+'\n//# sourceURL=dream-reader-fixed-'+PIN.version+'.js';document.body.appendChild(s);
  }catch(e){
   status.textContent='固定版信笺暂时没能展开（'+(e&&e.message||e)+'），以下为信件原文：';
   plain.textContent=$('dream-letter-src').content.textContent.trim();plain.hidden=false;retry.hidden=false;
  }finally{busy=false;}
 }
 const ctxName=k=>{for(const w of [window,window.parent]){try{const c=w&&w.SillyTavern&&w.SillyTavern.getContext&&w.SillyTavern.getContext();if(c&&c[k])return String(c[k]);}catch(e){}}return '';};
 const macroVal=(id,k)=>{const t=$(id),v=t?t.content.textContent.trim():'';return v&&v.indexOf('{'+'{')<0?v:ctxName(k);};
 const L='<',O='{'+'{',C='}'+'}';
 const MACROS=[[new RegExp(L+'user>','gi'),'dream-macro-user','name1'],[new RegExp(O+'user'+C,'gi'),'dream-macro-user','name1'],[new RegExp(L+'(?:bot|char)>','gi'),'dream-macro-char','name2'],[new RegExp(O+'char'+C,'gi'),'dream-macro-char','name2']];
 const macros=text=>{for(const [re,id,k] of MACROS){if(!re.test(text))continue;re.lastIndex=0;const v=macroVal(id,k);if(v)text=text.replace(re,()=>v);}return text;};
 retry.onclick=start;start();
})();</script></body></html>
