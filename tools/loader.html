<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><style>html,body{margin:0;padding:0;background:transparent}#dream-loader{font:14px/1.75 KaiTi,楷体,"Noto Serif SC",serif;color:#c59d5f;background:#18100d;border:1px solid rgba(197,157,95,.4);border-radius:8px;padding:14px 18px;margin:4px}#dream-loader-letter{white-space:pre-wrap;color:#eadbc0;margin-top:8px}#dream-loader button{margin-top:10px;background:#2d1f15;color:#e2c48f;border:1px solid #c59d5f;border-radius:5px;padding:6px 14px;font:inherit;cursor:pointer}</style></head><body><template id="dream-letter-src">$1</template><template id="dream-macro-user">{{user}}</template><template id="dream-macro-char">{{char}}</template><div id="dream-loader"><div id="dream-loader-status" role="status">信笺正在展开……</div><div id="dream-loader-letter" hidden></div><button id="dream-loader-retry" type="button" hidden>再试一次</button></div><script>(()=>{
 /* 外链固定在完整 Commit SHA 的 GitHub raw 地址，内容永不变化；要更新请改下面这一行里的 40 位版本号（或在更新提醒弹窗里一键替换）。 */
 const BASE="__BASE__",LOADER=2,PLACEHOLDER='<!--DREAM_LETTER-->',PREFIX='https://reader-cache.invalid/';
 const PIN=BASE.match(/^https:\/\/raw\.githubusercontent\.com\/Adirm007\/reader\/([0-9a-f]{40})\/$/),REV=PIN?PIN[1]:'';
 const $=id=>document.getElementById(id),status=$('dream-loader-status'),retry=$('dream-loader-retry'),plain=$('dream-loader-letter');let busy=false;
 const subtle=window.isSecureContext&&window.crypto&&window.crypto.subtle;
 const hex=b=>Array.from(new Uint8Array(b),v=>v.toString(16).padStart(2,'0')).join('');
 const openCache=async()=>{try{return window.caches?await caches.open('dream-reader-v1'):null;}catch(e){return null;}};
 const timed=(url,ms,opt)=>{const c=typeof AbortController==='function'?new AbortController():null,t=c?setTimeout(()=>c.abort(),ms):0;return fetch(url,Object.assign({credentials:'omit',signal:c?c.signal:undefined},opt||{})).finally(()=>clearTimeout(t));};
 const valid=m=>m&&m.schema===1&&m.files&&['reader.css','reader-body.html','reader.js'].every(k=>{const f=m.files[k];return f&&typeof f.path==='string'&&/^dist\/[\w.-]+$/.test(f.path)&&Number.isSafeInteger(f.bytes)&&f.bytes>0&&f.bytes<20000000&&/^[a-f0-9]{64}$/.test(f.sha256);});
 async function manifest(cache){
  if(!REV)throw Error('外链地址必须是完整 Commit SHA 的 GitHub raw 地址');
  const key=PREFIX+'manifest/'+REV;
  try{const r=await timed(BASE+'release-manifest.json',9000);if(!r.ok)throw Error('HTTP '+r.status);const text=await r.text();const m=JSON.parse(text);if(!valid(m))throw Error('清单无效');if(cache)await cache.put(key,new Response(text,{headers:{'Content-Type':'application/json'}}));return m;}catch(e){
   if(cache){const hit=await cache.match(key);if(hit){const m=JSON.parse(await hit.text());if(valid(m))return m;}}
   throw Error('外链清单加载失败（'+(e&&e.message||e)+'）');}
 }
 async function check(bytes,f){if(bytes.byteLength!==f.bytes)return false;if(!subtle)return true;return hex(await subtle.digest('SHA-256',bytes))===f.sha256;}
 async function asset(f,cache){
  const key=PREFIX+'sha256/'+f.sha256;
  if(cache){const hit=await cache.match(key);if(hit){const b=await hit.arrayBuffer();if(await check(b,f))return new TextDecoder().decode(b);}}
  const r=await timed(BASE+f.path,60000);if(!r.ok)throw Error('外链资源加载失败：'+f.path+'（HTTP '+r.status+'）');const b=await r.arrayBuffer();if(!(await check(b,f)))throw Error('外链资源校验失败：'+f.path);if(cache)await cache.put(key,new Response(b,{headers:{'Content-Type':'text/plain; charset=utf-8'}}));return new TextDecoder().decode(b);
 }
 async function start(){if(busy)return;busy=true;retry.hidden=true;status.textContent='信笺正在展开……';
  try{
   const cache=await openCache(),m=await manifest(cache);
   const [css0,body0,js0]=await Promise.all([asset(m.files['reader.css'],cache),asset(m.files['reader-body.html'],cache),asset(m.files['reader.js'],cache)]);
   const css=macros(css0),body=macros(body0),js=macros(js0),letter=$('dream-letter-src').innerHTML;
   const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);
   document.body.innerHTML=body.split(PLACEHOLDER).join(letter);
   window.DREAM_READER_RELEASE={version:m.version,content:m.content|0,rev:REV,base:BASE,mode:'loader',loader:LOADER};
   const s=document.createElement('script');s.text=js+'\n//# sourceURL=dream-reader-'+m.version+'.js';document.body.appendChild(s);
  }catch(e){
   status.textContent='信笺暂时没能展开（'+(e&&e.message||e)+'），以下为信件原文：';
   plain.textContent=$('dream-letter-src').content.textContent.trim();plain.hidden=false;retry.hidden=false;
  }finally{busy=false;}
 }
 /* 完整版正则的 replaceString 会经酒馆宏替换（用户名、角色名等宏）；外链资源不经过酒馆，这里按同样规则补做。宏名用拼接写出，避免加载器自身被酒馆提前替换。 */
 const ctxName=k=>{for(const w of [window,window.parent]){try{const c=w&&w.SillyTavern&&w.SillyTavern.getContext&&w.SillyTavern.getContext();if(c&&c[k])return String(c[k]);}catch(e){}}return '';};
 const macroVal=(id,k)=>{const t=$(id),v=t?t.content.textContent.trim():'';return v&&v.indexOf('{'+'{')<0?v:ctxName(k);};
 const L='<',O='{'+'{',C='}'+'}';
 const MACROS=[[new RegExp(L+'user>','gi'),'dream-macro-user','name1'],[new RegExp(O+'user'+C,'gi'),'dream-macro-user','name1'],[new RegExp(L+'(?:bot|char)>','gi'),'dream-macro-char','name2'],[new RegExp(O+'char'+C,'gi'),'dream-macro-char','name2']];
 const macros=text=>{for(const [re,id,k] of MACROS){if(!re.test(text))continue;re.lastIndex=0;const v=macroVal(id,k);if(v)text=text.replace(re,()=>v);}return text;};
 retry.onclick=start;start();
})();</script></body></html>
