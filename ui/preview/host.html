<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>读者预览宿主</title>
<!-- Not shipped. A fake SillyTavern page (same shape as tests/runtime.browser.test.mjs) that runs the real
     built runtime. Served from the 前端重置 folder: runtime and letter template come from /preview/build/,
     art from this worktree. Query: theme, open (lobby|persona|tuning|eggs|decouple|template|letters),
     letters (short,long,…), mode (inline|float), hide (1), unseal (1), ui (off), fp, appearance, persona. -->
<style>
  html, body { margin: 0; height: 100%; background: #3a3f44; font: 14px/1.5 "Noto Sans CJK SC", sans-serif; color: #ddd }
  #chat { max-width: 760px; margin: 0 auto; padding: 16px 12px 120px }
  .mes { margin: 0 0 18px; padding: 10px; background: #2b2f33; border-radius: 6px }
  .mes .who { font-size: 12px; color: #9aa; margin-bottom: 6px }
  .mes iframe { display: block; width: 100%; border: 0; height: 420px }
  #send_form { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; padding: 8px; background: #22262a }
  #send_textarea { flex: 1; height: 36px; background: #15181b; color: #ddd; border: 1px solid #444 }
</style>
</head>
<body>
<div id="chat"></div>
<div id="send_form"><textarea id="send_textarea"></textarea><button id="send_but">发送</button></div>
<script>
(function () {
  var q = new URLSearchParams(location.search), get = function (k, d) { return q.get(k) || d; };
  try {
    localStorage.setItem('dream_visual_theme', get('theme', 'cafe'));
    localStorage.setItem('dream_render_mode', get('mode', 'inline'));
    localStorage.setItem('dream_hide_persistent_float', q.get('hide') === '1' ? 'on' : 'off');
    localStorage.setItem('dream_auto_unseal', q.get('unseal') === '1' ? 'on' : 'off');
    if (q.get('ui') === 'off') localStorage.setItem('dream_ui_v4', 'off'); else localStorage.removeItem('dream_ui_v4');
  } catch (e) {}
  var vars = { dream_visual_theme: get('theme', 'cafe') };
  if (q.get('appearance')) vars.dream_appearance = q.get('appearance');
  if (q.get('persona')) vars.dream_persona = q.get('persona');
  window.__ctx = { chatId: 'preview', characterId: 1, name1: '作家', name2: '夜梦', chatMetadata: { variables: vars },
    chat: [{ mes: 'opening', swipe_id: 0 }], saveMetadata: function () { return Promise.resolve(); } };
  window.SillyTavern = { getContext: function () { return window.__ctx; } };
  window.__data = { stat_data: { 命运点数: Number(get('fp', '12480')), 主角: { 状态效果: {} } } };
  window.TavernHelper = {
    getVariables: function (o) { return o && o.type === 'chat' ? __ctx.chatMetadata.variables : __data; },
    updateVariablesWith: async function (f) { __data = f(__data); }, insertOrAssignVariables: async function () {},
    getLastMessageId: function () { return __ctx.chat.length - 1; },
    getCharWorldbookNames: function () { return { primary: null, additional: [] }; }, getWorldbook: function () { return []; }
  };
  window.tavern_events = Object.fromEntries(['CHAT_CHANGED', 'MESSAGE_RECEIVED', 'MESSAGE_SENT', 'MESSAGE_UPDATED', 'MESSAGE_SWIPED', 'MESSAGE_DELETED', 'GENERATION_ENDED', 'GENERATION_AFTER_COMMANDS'].map(function (k) { return [k, k]; }));
  window.__events = new Map();
  window.eventOn = function (name, fn) { var s = __events.get(name) || new Set(); s.add(fn); __events.set(name, s); return { stop: function () { s.delete(fn); } }; };
  window.emit = function (name) { (__events.get(name) || []).forEach(function (f) { f(); }); };
  __ctx.eventTypes = tavern_events;
  __ctx.eventSource = { makeFirst: function (n, fn) { __events.set(n, new Set([fn].concat(Array.from(__events.get(n) || [])))); }, removeListener: function (n, fn) { var s = __events.get(n); if (s) s.delete(fn); }, emit: async function (n) { for (var f of (__events.get(n) || [])) await f(); } };
  window.ReaderCoreConfig = { bookseaBase: location.origin + '/', uiAssetBase: location.origin + '/work/reader/' };

  var SAMPLES = {
    short: '今晚的雨下得很慢。我把你常坐的位置擦干净了，桌上那杯热可可还冒着气。想说的话不多：早点休息，别熬太晚。',
    long: '今天店里来了一位撑黑伞的客人，坐了很久，只点了一杯清咖啡。<br><br>我在吧台后面擦杯子，听雨把窗玻璃一层一层地洗干净。唱机放到第七首的时候，他忽然问我，你是不是在等谁。<br><br>我说是。<br><br>他笑了一下，把钱压在杯碟下面就走了。门口的风铃响了很久。<br><br>我想了想，其实也不算在等。只是你每次来的时候，我都会先把那一张桌子擦干净，把灯调暗一点，把那张你喜欢的唱片放进唱机里。等你推门进来，它刚好放到第二首。<br><br>今晚你来晚了。唱片已经转了两遍，可可也凉了，我又热了一次。没关系，下次早一点就好。<br><br>写到这里，窗外的雨好像小了一点。我把信放在你的杯子下面，你来的时候，记得先看信，再喝可可。',
    plain: '没有读者标签的普通新消息'
  };
  function template() { return fetch('/preview/build/letter.html', { cache: 'no-store' }).then(function (r) { return r.text(); }); }
  window.mountLetters = function (kinds) {
    return template().then(function (tpl) {
      var id = __ctx.chat.length, texts = kinds.map(function (k) { return SAMPLES[k] || k; });
      __ctx.chat.push({ mes: texts.map(function (t) { return '<dream>' + t + '</dream>'; }).join(''), swipe_id: 0 });
      var mes = document.createElement('div'); mes.className = 'mes'; mes.setAttribute('mesid', id);
      mes.innerHTML = '<div class="who">夜梦</div>';
      texts.forEach(function (text) {
        var frame = document.createElement('iframe');
        frame.srcdoc = tpl.split('$1').join(text);
        frame.addEventListener('load', function () {
          var doc = frame.contentDocument, fit = function () { frame.style.height = Math.max(120, doc.body.scrollHeight + 8) + 'px'; };
          fit(); try { new ResizeObserver(fit).observe(doc.documentElement); } catch (e) {} doc.addEventListener('toggle', function () { setTimeout(fit, 30); }, true); [300, 900, 2000].forEach(function (t) { setTimeout(fit, t); });
        });
        mes.appendChild(frame);
      });
      document.getElementById('chat').appendChild(mes);
      emit('MESSAGE_RECEIVED');
      return id;
    });
  };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var pick = function (sel, text) { return Array.prototype.find.call(document.querySelectorAll(sel), function (b) { return !text || b.textContent.indexOf(text) >= 0; }); };
  // The gacha test's catalogue: 120 works, one character each, no network.
  function mockFetch(url) {
    url = String(url);
    var json = function (v) { return new Response(JSON.stringify(v), {headers: {'Content-Type': 'application/json'}}); }, m;
    if ((m = /api\.bgm\.tv\/v0\/search\/subjects\?limit=(\d+)&offset=(\d+)/.exec(url))) {
      var limit = +m[1], offset = +m[2];
      return Promise.resolve(json({total: 120, limit: limit, offset: offset, data: Array.from({length: limit}, function (_, i) { var n = (offset + i) % 120; return {id: 5000 + n, type: 2, name: '作品' + n, name_cn: '测试作品' + n, summary: '少女在会移动的图书馆里醒来。', date: '2001-01-01', images: {}, tags: [{name: '奇幻'}], rating: {score: 7}}; })}));
    }
    if (/api\.bgm\.tv\/v0\/subjects\/\d+\/characters/.test(url)) return Promise.resolve(json([{id: 1, name: '旅人', relation: '主角', type: 1}]));
    if (/api\.bgm\.tv\/v0\/subjects\/\d+$/.test(url)) return Promise.resolve(json({summary: '少女在会移动的图书馆里醒来，必须在三个夜晚里找回被借走的名字。', infobox: []}));
    if (/api\.bgm\.tv\/v0\/characters\//.test(url)) return Promise.resolve(json({summary: '', infobox: []}));
    return Promise.resolve(new Response('{}', {status: 503}));
  }
  async function runDemo(demo) {
    if (demo === 'slip' || demo === 'toast') {
      ReaderCore.open('lobby'); await wait(900);
      pick('#dlb-overlay [data-dlb="special"][data-k="喜"]').click(); await wait(700);
      if (demo === 'toast') { document.querySelector('.u4-rc .q-yes').click(); await wait(900); }
      return;
    }
    if (demo === 'booksea') { ReaderCore.open('eggs'); await wait(900); pick('[data-dlb="eggbooksea"]').click(); return; }
    if (demo === 'form' || demo === 'studio') { ReaderCore.open(demo === 'form' ? 'eggs' : 'persona'); await wait(900); pick(demo === 'form' ? '[data-dlb="eggwb"]' : '[data-dlb="custompersona"]').click(); return; }
    if (demo === 'stage' || demo === 'stagecards') {
      document.getElementById('reader-core-controller').contentWindow.fetch = mockFetch;
      ReaderCore.open('lobby'); await wait(900);
      pick('#dlb-overlay [data-dlb="gacha"]').click(); await wait(1000);
      pick('.bs-gacha .gc-theme', '奇幻').click(); await wait(250);
      pick('.bs-gacha .gc-actions button', '撒网').click(); await wait(250);
      document.querySelector('.bs-gacha .gc-actions button.is-armed').click();
      for (var i = 0; i < 80 && !document.querySelector('.bs-gacha .gc-grid .gc-work'); i++) await wait(250);
      document.querySelector('.bs-gacha .gc-grid .gc-work').click(); await wait(400);
      pick('.bs-gacha .gc-drawer button', '选为小池').click();
      for (var j = 0; j < 80 && !document.querySelector('.bs-gacha .gc-tabs'); j++) await wait(250);
      pick('.bs-gacha .gc-draws button', '十连').click();
    }
  }
  window.addEventListener('load', async function () {
    window.runtimeModule = await import('/preview/build/reader-runtime.js');
    runtimeModule.start();
    await ReaderCore.ready;
    var letters = (q.get('letters') || '').split(',').filter(Boolean);
    if (letters.length) await mountLetters(letters);
    var open = q.get('open');
    if (open) setTimeout(function () { ReaderCore.open(open); }, letters.length ? 400 : 60);
    // demo=slip|toast|stage|stagecards|booksea|form|studio: walk to that moment for screenshots (preview only)
    var demo = q.get('demo');
    if (demo) setTimeout(function () { runDemo(demo).catch(function (e) { console.error('demo', e); }); }, 900);
    document.documentElement.setAttribute('data-preview-ready', '1');
  });
})();
</script>
</body>
</html>
