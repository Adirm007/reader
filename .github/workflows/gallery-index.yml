name: Update gallery index
on:
  push:
    branches: [main]
    paths:
      - 'gallery/**'
      - '!gallery/index.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gallery-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gallery/index.json
        run: python3 tools/gallery_index.py
      - name: Commit index if changed
        run: |
          if git diff --quiet -- gallery/index.json; then echo "index unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/index.json
          git commit -m "Update gallery index [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
