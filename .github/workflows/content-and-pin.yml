name: Update content indexes and pin latest
# 外链只允许完整 Commit SHA 的 GitHub raw 地址：每次推送后把 latest.json 与外链版正则固定到最新提交。
# 相册 / 人格 / 世界书有变化时先重建索引并把 content 计数加一，用户会收到“内容更新”提醒。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'latest.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: content-and-pin
  cancel-in-progress: false
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build gallery/index.json, personas/index.json and worldbook/manifest.json
        run: |
          python3 tools/gallery_index.py
          python3 tools/personas_index.py
          python3 tools/worldbook_manifest.py
      - name: Commit indexes (and bump content counter) if changed
        run: |
          if git diff --quiet -- gallery/index.json personas/index.json worldbook/manifest.json; then echo "indexes unchanged"; exit 0; fi
          python3 tools/bump_content.py
          git add gallery/index.json personas/index.json worldbook/manifest.json release-manifest.json
          git commit -m "Update content indexes [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Pin latest.json and the external regex to the current full commit SHA
        run: |
          TARGET=$(git rev-parse HEAD)
          python3 tools/pin_latest.py "$TARGET"
          if git diff --quiet -- latest.json regex; then echo "pin unchanged"; exit 0; fi
          git add latest.json regex
          git commit -m "Pin latest to ${TARGET:0:7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
